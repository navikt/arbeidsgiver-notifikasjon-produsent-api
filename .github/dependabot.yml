version: 2

updates:
  # pnpm-prosjekter (test-produsent inkl. server, docs, fake-produsent-api/server).
  # Kun oppdateringer innenfor rangene i package.json.
  - package-ecosystem: npm
    directories:
      - "/test-produsent"
      - "/docs"
      - "/fake-produsent-api/server"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    cooldown:
      default-days: 3
    versioning-strategy: lockfile-only
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pnpm:
        patterns: ["*"]
        update-types: [minor, patch]

  # Backend (app/). Kun minor- og patch-oppdateringer.
  - package-ecosystem: maven
    directory: "/app"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      maven:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]

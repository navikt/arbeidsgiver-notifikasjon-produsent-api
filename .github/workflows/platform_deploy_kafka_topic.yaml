name: "Platform: deploy kafka topic"
on:
  push:
    branches: ['main']
    paths: ['app/nais/nais-kafka-topic.yaml', 'app/nais/nais-kafka-topic-ekstern-varsling-status.yaml']
  workflow_dispatch:

jobs:
  deploy-kafka:
    name: Deploy kafka
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: app/nais/nais-kafka-topic.yaml
          PRINT_PAYLOAD: true
          VAR: pool=nav-dev

      - uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        if: github.ref == 'refs/heads/main'
        env:
          CLUSTER: prod-gcp
          RESOURCE: app/nais/nais-kafka-topic.yaml
          PRINT_PAYLOAD: true
          VAR: pool=nav-prod

      - uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: app/nais/nais-kafka-topic-ekstern-varsling-status.yaml
          PRINT_PAYLOAD: true
          VAR: pool=nav-dev

      - uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        if: github.ref == 'refs/heads/main'
        env:
          CLUSTER: prod-gcp
          RESOURCE: app/nais/nais-kafka-topic-ekstern-varsling-status.yaml
          PRINT_PAYLOAD: true
          VAR: pool=nav-prod

name: "Testprodusent: build and deploy"
on:
  push:
    branches:
      - main
    paths:
      - test-produsent/**
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'


jobs:
  build_and_push:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: test-produsent/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: test-produsent/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: test-produsent

      - run: pnpm build
        working-directory: test-produsent

      - name: Create self-contained server deployment
        run: |
          pnpm --filter=server deploy --prod server-deploy
        working-directory: test-produsent

      - uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        id: docker-push
        with:
          team: fager
          docker_context: test-produsent/
          dockerfile: test-produsent/Dockerfile
          image_suffix: test-produsent
          tag: ${{ github.sha }}

      - uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: test-produsent/nais-application.yaml
          PRINT_PAYLOAD: true
          VAR: commit=${{ github.sha }},image=${{ steps.docker-push.outputs.image }}

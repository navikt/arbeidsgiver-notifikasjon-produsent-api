name: "Fake produsent api: build and deploy"
on:
  push:
    branches:
      - main
    paths:
      - app/src/main/resources/produsent.graphql
      - fake-produsent-api/**
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build_and_push:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: fake-produsent-api/server/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com/
          cache: 'pnpm'
          cache-dependency-path: fake-produsent-api/server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: fake-produsent-api/server

      - run: pnpm run gql:cp_schema
        working-directory: fake-produsent-api/server

      - uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        id: docker-push
        with:
          team: fager
          docker_context: fake-produsent-api/
          dockerfile: fake-produsent-api/Dockerfile
          image_suffix: fake-produsent-api
          tag: ${{ github.sha }}

      - uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          VAR: image=${{ steps.docker-push.outputs.image }}
          CLUSTER: dev-gcp
          RESOURCE: fake-produsent-api/nais-application.yaml
          PRINT_PAYLOAD: true

  ghcr_push:
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: fake-produsent-api/server/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com/
          cache: 'pnpm'
          cache-dependency-path: fake-produsent-api/server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: fake-produsent-api/server

      - run: pnpm run gql:cp_schema
        working-directory: fake-produsent-api/server

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # base image is pulled from Chainguard via GAR, which requires auth
      - uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        with:
          team: fager

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          platforms: linux/amd64,linux/arm64
          context: fake-produsent-api
          push: true
          tags: ghcr.io/${{ github.repository }}/fake-produsent-api:latest

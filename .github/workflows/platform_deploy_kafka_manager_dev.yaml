name: "Platform: deploy kafka-manager dev"
on:
  push:
    branches:
      - main
    paths:
      - app/nais/dev-gcp-kafka-manager.yaml
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        name: "dev-gcp: deploy kafka-manager"
        env:
          CLUSTER: dev-gcp
          RESOURCE: app/nais/dev-gcp-kafka-manager.yaml

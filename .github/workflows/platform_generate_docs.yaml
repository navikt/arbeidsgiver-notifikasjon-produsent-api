name: "Platform: verify docs"
on:
  push:
    branches:
      - main
    paths:
      - app/src/main/resources/produsent.graphql
      - docs/**
  pull_request:
    paths:
      - app/src/main/resources/produsent.graphql
      - docs/**

jobs:
  verify-docs:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - working-directory: ./docs
        run: pnpm install --frozen-lockfile

      - working-directory: ./docs
        run: pnpm run update-gqldoc

      - name: Verify docs are up to date
        working-directory: ./docs
        run: |
          if ! git diff --exit-code api.html; then
            echo ""
            echo "========================================="
            echo "ERROR: api.html is out of date."
            echo "Run 'pnpm run update-gqldoc' in the docs/ directory and commit the result."
            echo "========================================="
            exit 1
          fi

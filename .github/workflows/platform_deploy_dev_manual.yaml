name: "Platform: deploy dev manual"
on:
  workflow_dispatch:

jobs:
  dev-deploy:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    environment: dev-gcp:fager
    strategy:
      matrix:
        cluster:
          - dev-gcp
        app:
          - bruker-api
          - bruker-api-writer
          - produsent-api
          - kafka-reaper
          - ekstern-varsling
          - replay-validator
          - kafka-backup
          - skedulert-utgaatt
          - skedulert-harddelete
          - skedulert-paaminnelse
          - dataprodukt
          - kafka-bq
          #- manuelt-vedlikehold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: NAIS login
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        id: login
        with:
          team: fager
      - uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        name: "${{ matrix.cluster }}: deploy ${{ matrix.app }}"
        env:
          VAR: image=${{ steps.login.outputs.registry }}/arbeidsgiver-notifikasjon-produsent-api:${{ github.sha }}
          REF: ${{ github.sha }}
          CLUSTER: ${{ matrix.cluster }}
          RESOURCE: app/nais/${{ matrix.cluster }}-${{ matrix.app }}.yaml
